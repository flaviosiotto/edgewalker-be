name: Build And Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      edgewalker_ref:
        description: Git ref from the edgewalker repository to bake into the backend image
        required: false
        default: main

concurrency:
  group: backend-production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  EDGEWALKER_REPOSITORY: ${{ vars.EDGEWALKER_REPOSITORY != '' && vars.EDGEWALKER_REPOSITORY || 'flaviosiotto/edgewalker' }}
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
  DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve edgewalker ref
        id: resolve-ref
        env:
          WORKFLOW_DISPATCH_REF: ${{ inputs.edgewalker_ref }}
        run: |
          set -eu

          edgewalker_ref="${WORKFLOW_DISPATCH_REF:-}"

          if [ -z "${edgewalker_ref}" ]; then
            edgewalker_ref="main"
          fi

          echo "edgewalker_ref=${edgewalker_ref}" >> "${GITHUB_OUTPUT}"

      - name: Validate edgewalker checkout configuration
        id: edgewalker-config
        env:
          EDGEWALKER_REPOSITORY_ACCESS_TOKEN: ${{ secrets.EDGEWALKER_REPOSITORY_ACCESS_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -eu

          if [ -z "${EDGEWALKER_REPOSITORY}" ]; then
            echo "Missing EDGEWALKER_REPOSITORY" >&2
            exit 1
          fi

          case "${EDGEWALKER_REPOSITORY}" in
            */*)
              ;;
            *)
              echo "EDGEWALKER_REPOSITORY must be in owner/repo format. Current value: ${EDGEWALKER_REPOSITORY}" >&2
              exit 1
              ;;
          esac

          token="${EDGEWALKER_REPOSITORY_ACCESS_TOKEN:-${GITHUB_TOKEN_FALLBACK}}"

          status_code=$(curl -sS -o /tmp/edgewalker_repo_check.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${EDGEWALKER_REPOSITORY}")

          if [ "${status_code}" != "200" ]; then
            echo "Unable to access ${EDGEWALKER_REPOSITORY} (HTTP ${status_code})." >&2
            echo "If the repository is private and different from the current repository, github.token is not enough: configure EDGEWALKER_REPOSITORY_ACCESS_TOKEN with read access to ${EDGEWALKER_REPOSITORY}." >&2
            cat /tmp/edgewalker_repo_check.json >&2 || true
            exit 1
          fi

          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout edgewalker repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EDGEWALKER_REPOSITORY }}
          ref: ${{ steps.resolve-ref.outputs.edgewalker_ref }}
          path: edgewalker
          token: ${{ steps.edgewalker-config.outputs.token }}

      - name: Validate workflow configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu

          missing=""

          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            missing="${missing} DOCKERHUB_USERNAME"
          fi

          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            missing="${missing} DOCKERHUB_TOKEN"
          fi

          if [ -z "${IMAGE_NAME}" ]; then
            missing="${missing} DOCKERHUB_REPOSITORY"
          fi

          if [ -n "${missing}" ]; then
            echo "Missing required GitHub secrets/variables:${missing}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-contexts: |
            edgewalker=./edgewalker
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Dokploy deployment
        if: ${{ env.DOKPLOY_URL != '' && env.DOKPLOY_APPLICATION_ID != '' && env.DOKPLOY_API_KEY != '' }}
        run: |
          set -eu
          curl -fsS -X POST "${DOKPLOY_URL}/api/application.deploy" \
            -H 'accept: application/json' \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\"}"